# nginx (on the VPS host — NOT containerized) reverse proxy for warehouse-system-api.
# Proxies to the `app` container's published port (docker-compose.yml: "127.0.0.1:3000:3000").
# Mirrors the sibling skinet-auth-api's deploy/nginx-auth.conf for consistency.
#
# Copy to /etc/nginx/sites-available/api-wms.itpintar.co.id, symlink into sites-enabled,
# then `certbot --nginx -d api-wms.itpintar.co.id` (it edits this file in place to add the
# TLS block — the http-only server below is the starting point certbot needs).
#
# See docs/deployment-vps.md §6.

upstream warehouse_system_api {
    server 127.0.0.1:3000; # the `app` container, published to loopback only — not the container directly
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-wms.itpintar.co.id;

    # certbot will add its own location block here for the ACME challenge,
    # and a second `server { listen 443 ssl; ... }` block below this one.

    client_max_body_size 12m; # the item-import endpoint accepts up to 10MB files (app-enforced)

    location / {
        proxy_pass http://warehouse_system_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
